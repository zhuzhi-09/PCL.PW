# 构建并发布 Windows、安卓与 macOS 版
# - 推送到 main：更新 nightly 预发布（每次替换为最新构建）
# - 推送 v* 标签：发布正式版；标签带 "-"（如 v0.3.0-beta）时标为预发布
# macOS 版没有 Apple 开发者签名与公证（临时签名），用户首次打开时需要在系统设置中允许
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

env:
  FLUTTER_VERSION: 3.47.9
  # 写进程序里的构建信息，供启动器的更新功能判断通道与版本
  PCLPW_COMMIT: ${{ github.sha }}
  PCLPW_CHANNEL: ${{ github.ref_type != 'tag' && 'nightly' || contains(github.ref_name, '-') && 'preview' || 'stable' }}
  PCLPW_MS_CLIENT_ID: ${{ vars.PCLPW_MS_CLIENT_ID }}

jobs:
  # 静态分析与自动化测试，失败时不构建、不发布。
  # 需要真实游戏环境的 test/manual/ 没有设置环境变量时会自动跳过
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # window_manager 依赖的 cnativeapi 在测试时会编译本地代码，需要 GTK 3、X11、Xi 的开发包
      - name: Dependencies
        timeout-minutes: 20
        run: bash .github/apt-install.sh libgtk-3-dev libx11-dev libxi-dev pkg-config
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        run: |
          flutter pub get
          dart run tool/build_installer.dart
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*-setup.exe
            dist/*-portable.zip

  # Windows ARM64：在 ARM64 机器上原生编译。Flutter 没有 ARM64 的 SDK 压缩包，用 git 拉取对应版本
  windows-arm64:
    needs: check
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v5
      - name: Flutter
        shell: bash
        run: |
          git clone --depth 1 -b "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Build
        env:
          PW_ARCH: arm64
        run: |
          flutter config --no-analytics
          flutter pub get
          dart run tool/build_installer.dart
      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: |
            dist/*-setup.exe
            dist/*-portable.zip

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # 没有配置签名密钥时用调试签名（每次构建的签名不同，无法覆盖安装）
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "PCLPW_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::没有配置 ANDROID_KEYSTORE_BASE64，APK 使用调试签名"
          fi
      - name: Build
        env:
          PCLPW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PCLPW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PCLPW_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons             --dart-define=PCLPW_COMMIT="$PCLPW_COMMIT" --dart-define=PCLPW_CHANNEL="$PCLPW_CHANNEL" --dart-define=PCLPW_MS_CLIENT_ID="$PCLPW_MS_CLIENT_ID"
          version=$(sed -n 's/^version:[[:space:]]*\([0-9.]*\).*/\1/p' pubspec.yaml)
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/PixelWorld-$version-android-arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        run: |
          flutter pub get
          flutter build macos --release --dart-define=PCLPW_COMMIT="$PCLPW_COMMIT" --dart-define=PCLPW_CHANNEL="$PCLPW_CHANNEL" --dart-define=PCLPW_MS_CLIENT_ID="$PCLPW_MS_CLIENT_ID"
          version=$(sed -n 's/^version:[[:space:]]*\([0-9.]*\).*/\1/p' pubspec.yaml)
          app="build/macos/Build/Products/Release/Pixel World.app"
          # 没有开发者证书：整个应用重新做一次临时签名，保证各个框架的签名一致
          codesign --force --deep --sign - "$app"
          # 安装镜像：Pixel World.app 与「应用程序」文件夹的快捷方式，拖进去即可安装
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage" dist
          cp -R "$app" "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "Pixel World" -srcfolder "$stage" -ov -format UDZO "dist/PixelWorld-$version-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  # Linux 版还在测试：只在 nightly 构建，正式标签不发布。
  # cnativeapi 需要 glib 2.74+ 的 G_CONNECT_DEFAULT，使用 Ubuntu 24.04 构建，
  # 兼容 glibc 2.39 及以上的发行版。
  # aarch64 在 ARM64 机器上原生编译；Flutter 没有 Linux ARM64 的 SDK 压缩包，用 git 拉取对应版本
  linux:
    needs: check
    if: ${{ github.ref_type == 'branch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, flutter: x64, deb: amd64, rpm: x86_64, tar: x64 }
          - { os: ubuntu-24.04-arm, flutter: arm64, deb: arm64, rpm: aarch64, tar: arm64 }
    runs-on: ${{ matrix.os }}
    env:
      FLUTTER_ARCH: ${{ matrix.flutter }}
      DEB_ARCH: ${{ matrix.deb }}
      RPM_ARCH: ${{ matrix.rpm }}
      TAR_ARCH: ${{ matrix.tar }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        if: ${{ matrix.flutter == 'x64' }}
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Flutter (ARM64)
        if: ${{ matrix.flutter == 'arm64' }}
        run: |
          git clone --depth 1 -b "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Dependencies
        timeout-minutes: 20
        run: >-
          bash .github/apt-install.sh clang cmake ninja-build pkg-config
          libgtk-3-dev liblzma-dev libx11-dev libxi-dev rpm
          makepkg pacman-package-manager zstd libarchive-tools
      - name: Build
        run: |
          set -euo pipefail
          flutter pub get
          flutter build linux --release --dart-define=PCLPW_COMMIT="$PCLPW_COMMIT" --dart-define=PCLPW_CHANNEL="$PCLPW_CHANNEL" --dart-define=PCLPW_MS_CLIENT_ID="$PCLPW_MS_CLIENT_ID"
          version=$(sed -n 's/^version:[[:space:]]*\([0-9.]*\).*/\1/p' pubspec.yaml)
          stage="$RUNNER_TEMP/PixelWorld"
          bundle="build/linux/$FLUTTER_ARCH/release/bundle"
          rm -rf "$stage" "$RUNNER_TEMP"/pclpw-* "$RUNNER_TEMP"/PixelWorld.AppDir
          mkdir -p "$stage" dist
          cp -R "$bundle/." "$stage/"
          icon="$stage/data/flutter_assets/assets/icon/icon.png"

          desktop="$RUNNER_TEMP/io.github.zhuzhi09.pcl_pw.desktop"
          cp packaging/linux/io.github.zhuzhi09.pcl_pw.desktop "$desktop"

          tar -C "$RUNNER_TEMP" -czf "dist/PixelWorld-$version-linux-$TAR_ARCH.tar.gz" PixelWorld

          # Debian / Ubuntu
          pkg="$RUNNER_TEMP/pkgroot"
          rm -rf "$pkg"
          mkdir -p "$pkg/opt/PCL.PW" "$pkg/usr/bin" \
            "$pkg/usr/share/applications" \
            "$pkg/usr/share/icons/hicolor/256x256/apps" "$pkg/DEBIAN"
          cp -a "$stage/." "$pkg/opt/PCL.PW/"
          ln -s /opt/PCL.PW/pcl_pw "$pkg/usr/bin/pcl-pw"
          install -m644 "$desktop" "$pkg/usr/share/applications/io.github.zhuzhi09.pcl_pw.desktop"
          install -m644 "$icon" "$pkg/usr/share/icons/hicolor/256x256/apps/io.github.zhuzhi09.pcl_pw.png"
          sed -e "s/@VERSION@/$version/" -e "s/@ARCH@/$DEB_ARCH/" packaging/linux/control > "$pkg/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$pkg" "dist/PixelWorld-$version-linux-$DEB_ARCH.deb"

          # Fedora / openSUSE / RHEL
          rpmtop="$RUNNER_TEMP/rpmbuild"
          rm -rf "$rpmtop"
          mkdir -p "$rpmtop"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          spec="$rpmtop/SPECS/pcl-pw.spec"
          sed -e "s|@VERSION@|$version|g" \
            -e "s|@STAGE@|$stage|g" \
            -e "s|@DESKTOP@|$desktop|g" \
            -e "s|@ICON@|$icon|g" \
            -e "s|@ARCH@|$RPM_ARCH|g" \
            packaging/linux/pcl-pw.spec > "$spec"
          rpmbuild -bb --define "_topdir $rpmtop" "$spec"
          cp "$rpmtop/RPMS/$RPM_ARCH/pcl-pw-$version-1.$RPM_ARCH.rpm" "dist/PixelWorld-$version-linux-$RPM_ARCH.rpm"

          # Arch / CachyOS / Manjaro
          archbuild="$RUNNER_TEMP/archbuild"
          rm -rf "$archbuild"
          mkdir -p "$archbuild"
          sed -e "s|@VERSION@|$version|g" \
            -e "s|@STAGE@|$stage|g" \
            -e "s|@DESKTOP@|$desktop|g" \
            -e "s|@ICON@|$icon|g" \
            -e "s|@ARCH@|$RPM_ARCH|g" \
            packaging/linux/PKGBUILD > "$archbuild/PKGBUILD"
          # Ubuntu 的 makepkg.conf 写的是 x86_64，按机器架构改掉
          sed -e "s|^PKGEXT=.*|PKGEXT='.pkg.tar.zst'|" -e "s|^CARCH=.*|CARCH=\"$RPM_ARCH\"|" \
            -e "s|^CHOST=.*|CHOST=\"$RPM_ARCH-pc-linux-gnu\"|" /etc/makepkg.conf > "$RUNNER_TEMP/makepkg.conf"
          (cd "$archbuild" && PACKAGER="Pixel World <paper_zhu@163.com>" \
            makepkg --config "$RUNNER_TEMP/makepkg.conf" --nodeps --noconfirm)
          cp "$archbuild/pcl-pw-$version-1-$RPM_ARCH.pkg.tar.zst" \
            "dist/PixelWorld-$version-linux-$RPM_ARCH.pkg.tar.zst"

          # AppImage
          appdir="$RUNNER_TEMP/PixelWorld.AppDir"
          mkdir -p "$appdir/usr/bin"
          cp -a "$stage/." "$appdir/usr/bin/"
          sed 's/^Exec=.*/Exec=pcl_pw/' "$desktop" > "$appdir/io.github.zhuzhi09.pcl_pw.desktop"
          cp "$icon" "$appdir/io.github.zhuzhi09.pcl_pw.png"
          ln -sf io.github.zhuzhi09.pcl_pw.png "$appdir/.DirIcon"
          cp packaging/linux/AppRun "$appdir/AppRun"
          chmod +x "$appdir/AppRun"
          curl -fL --retry 3 -o "$RUNNER_TEMP/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-$RPM_ARCH.AppImage"
          chmod +x "$RUNNER_TEMP/appimagetool"
          ARCH="$RPM_ARCH" "$RUNNER_TEMP/appimagetool" --appimage-extract-and-run \
            "$appdir" "dist/PixelWorld-$version-linux-$RPM_ARCH.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.tar }}
          path: |
            dist/*-linux-*.tar.gz
            dist/*-linux-*.deb
            dist/*-linux-*.rpm
            dist/*-linux-*.pkg.tar.zst
            dist/*-linux-*.AppImage

  publish:
    needs: [windows, windows-arm64, android, macos, linux]
    # macOS、Linux 或 ARM64 版构建失败时仍然发布 Windows 与安卓版
    # 只有 main 与版本标签会发布；在其他分支手动运行时只构建，用来验证工作流
    if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && needs.windows.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version:[[:space:]]*\([0-9.]*\).*/\1/p' pubspec.yaml)
          sha=${GITHUB_SHA::7}
          about="本软件是第三方基于 PCL 二次创作的产物，与 PCL 及其作者无关，请勿就本软件的问题打扰 PCL 作者。"
          # 下载说明按实际产出的文件生成：某个平台或架构没有构建成功时不列出来
          has() { compgen -G "dist/$1" >/dev/null; }
          downloads=$'- Windows（x64）：安装包（`*-windows-x64-setup.exe`）或便携版（`*-windows-x64-portable.zip`）'
          if has '*-windows-arm64-*'; then
            downloads+=$'\n- Windows（ARM64，测试版）：`*-windows-arm64-setup.exe` 或 `*-windows-arm64-portable.zip`，骁龙等 ARM 处理器的 Windows 电脑原生运行'
          fi
          downloads+=$'\n- 安卓：`*-android-arm64.apk`，需要 Android 8.0 及以上、64 位 ARM 处理器'
          if has '*-macos.dmg'; then
            downloads+=$'\n- macOS：`*-macos.dmg`，需要 macOS 12 及以上，Apple 芯片与 Intel 通用。没有经过 Apple 公证，首次打开时如果提示无法验证开发者，请到「系统设置 → 隐私与安全性」中点「仍要打开」'
          fi
          if has '*-linux-*'; then
            downloads+=$'\n- Linux（测试版）：需要 Ubuntu 24.04 及以上（glibc 2.39+）。x86_64 电脑选 `amd64` / `x86_64` / `x64`，ARM64 电脑选 `arm64` / `aarch64`'
            downloads+=$'\n  - `*.deb`：Debian/Ubuntu 安装包\n  - `*.rpm`：Fedora/openSUSE/RHEL 安装包\n  - `*.pkg.tar.zst`：Arch / CachyOS / Manjaro 安装包，`sudo pacman -U 文件名`\n  - `*.AppImage`：下载后 `chmod +x` 直接运行\n  - `*.tar.gz`：解压后运行 `PixelWorld/pcl_pw`'
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            # 更新说明写在 release-notes/<标签>.md 中；没有时显示该标签对应提交的说明
            if [ -f "release-notes/$tag.md" ]; then
              changelog=$(cat "release-notes/$tag.md")
            else
              changelog=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .commit.message | sed '/^Co-authored-by:/d')
            fi
            if [ -n "$changelog" ]; then
              notes=$(printf '%s\n\n## 下载\n\n%s\n\n%s\n' "$changelog" "$downloads" "$about")
            else
              notes=$(printf '%s\n\n%s\n' "$downloads" "$about")
            fi
            flags=(--title "Pixel World $tag" --notes "$notes" --verify-tag)
            case "$tag" in *-*) flags+=(--prerelease) ;; *) flags+=(--latest) ;; esac
            gh release delete "$tag" --yes 2>/dev/null || true
            gh release create "$tag" "${flags[@]}" dist/*
          else
            # 文件名标明 nightly 与提交号，避免和正式版混淆
            for f in dist/PixelWorld-"$version"-*; do mv "$f" "${f/PixelWorld-$version-/PixelWorld-nightly-$sha-}"; done
            # 更新日志：和上一次 nightly 比较；没有可比的对象时显示本次提交的说明
            prev=$(gh release view nightly --json targetCommitish --jq .targetCommitish 2>/dev/null || true)
            changes=""
            if [ -n "$prev" ] && [ "$prev" != "$GITHUB_SHA" ]; then
              changes=$(gh api "repos/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_SHA" \
                --jq '.commits[:50][] | select(.commit.message | startswith("Merge") | not) | "- `\(.sha[0:7])` \(.commit.message | split("\n")[0])"' 2>/dev/null || true)
            fi
            if [ -z "$changes" ]; then
              changes=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.message | sed '/^Co-authored-by:/d')
            fi
            notes=$(printf '自动构建的测试版，来自 main 分支的 %s，可能不稳定。\n\n## 更新日志\n\n%s\n\n%s\n\n%s\n' "$GITHUB_SHA" "$changes" "$downloads" "$about")
            gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
            gh release create nightly --prerelease --target "$GITHUB_SHA" \
              --title "Pixel World Nightly ($sha)" --notes "$notes" dist/*
          fi
      # 更新启动器的更新接口：官网（site 分支）的 docs/api/v1/update.json。
      # 公告 notices.json 在 site 分支上手动维护，这里不改动
      - name: Update API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" > "$RUNNER_TEMP/releases.json"
          python3 tool/update_api.py "$RUNNER_TEMP/releases.json" > "$RUNNER_TEMP/update.json"
          git fetch --depth=1 origin site
          git worktree add "$RUNNER_TEMP/site" FETCH_HEAD
          cd "$RUNNER_TEMP/site"
          mkdir -p docs/api/v1
          cp "$RUNNER_TEMP/update.json" docs/api/v1/update.json
          git add docs/api/v1/update.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "更新接口：${GITHUB_REF_NAME} ${GITHUB_SHA::7}"
          git push origin HEAD:site
          # 用 GITHUB_TOKEN 推送不一定触发 Pages 构建，主动请求一次
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" >/dev/null || true
